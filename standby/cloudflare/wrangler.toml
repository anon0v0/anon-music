# Cloudflare Worker — 可选故障回退（不推荐日常挂在主域名）
#
# 国内访问请勿对 music.saki.li 开橙云 + 绑此 Worker。
# 日常：DNS 灰云直连中转/源站。
# 挂了：用 Pages 状态页（见 package.json 的 pages 脚本 / DEPLOY.md）。
#
# 仅当你明确需要「主域名橙云故障回退」时才 deploy 并添加路由。

name = "anon-music-failover"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = true
preview_urls = true

# 默认不绑定 music.saki.li/*，避免拖慢全国访问。
# routes = [
#   { pattern = "music.saki.li/*", zone_name = "saki.li" }
# ]
