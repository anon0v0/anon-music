# Cloudflare Worker 故障回退
# 部署：npx wrangler deploy
#
# 注意：不要启用 assets SPA not_found_handling！
# 否则 /music 会被静态 index.html（维护页）劫持，出现
# “healthz ok → 跳 /music → 又是维护页”的死循环。

name = "anon-music-failover"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = true
preview_urls = true

routes = [
  { pattern = "music.saki.li/*", zone_name = "saki.li" }
]

# 不绑定 ASSETS / 不做 SPA 回退；维护页内联在 worker.js
